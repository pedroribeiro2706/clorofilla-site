<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Responsividade - Clorofilla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS do site -->
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/o-que-fazemos.css">
    <link rel="stylesheet" href="css/diferenciais.css">
    <link rel="stylesheet" href="css/contato.css">
    <link rel="stylesheet" href="css/footer.css">
    
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .test-controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #333;
            color: white;
            padding: 10px;
            z-index: 9999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-controls select, .test-controls button {
            margin: 0 5px;
            padding: 5px 10px;
        }
        .test-section {
            margin-top: 60px;
            padding: 20px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .test-section h2 {
            margin-top: 0;
        }
        .device-frame {
            border: 10px solid #333;
            border-radius: 10px;
            margin: 0 auto;
            transition: all 0.3s ease;
            overflow: hidden;
            height: 80vh;
        }
        .device-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .size-indicator {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="test-controls">
        <div>
            <h4 style="display: inline-block; margin-right: 15px;">Teste de Responsividade</h4>
            <select id="deviceSelect" class="form-select form-select-sm" style="display: inline-block; width: auto;">
                <option value="desktop">Desktop (1200px)</option>
                <option value="laptop">Laptop (992px)</option>
                <option value="tablet">Tablet (768px)</option>
                <option value="mobile">Mobile (576px)</option>
                <option value="smallMobile">Small Mobile (375px)</option>
            </select>
            <button id="rotateBtn" class="btn btn-sm btn-light">Rotacionar</button>
        </div>
        <div>
            <button id="testScrollBtn" class="btn btn-sm btn-primary">Testar Scroll</button>
            <button id="testTouchBtn" class="btn btn-sm btn-success">Simular Touch</button>
        </div>
    </div>

    <div class="container-fluid">
        <div class="device-frame" id="deviceFrame">
            <iframe src="index.html" id="testFrame"></iframe>
        </div>
    </div>

    <div class="size-indicator" id="sizeIndicator">
        Tamanho: <span id="currentSize">1200 x 800</span>px
    </div>

    <script>
        // Configurações de tamanho dos dispositivos
        const deviceSizes = {
            desktop: { width: 1200, height: 800 },
            laptop: { width: 992, height: 600 },
            tablet: { width: 768, height: 1024 },
            mobile: { width: 576, height: 812 },
            smallMobile: { width: 375, height: 667 }
        };

        // Elementos DOM
        const deviceSelect = document.getElementById('deviceSelect');
        const rotateBtn = document.getElementById('rotateBtn');
        const deviceFrame = document.getElementById('deviceFrame');
        const testFrame = document.getElementById('testFrame');
        const sizeIndicator = document.getElementById('sizeIndicator');
        const currentSize = document.getElementById('currentSize');
        const testScrollBtn = document.getElementById('testScrollBtn');
        const testTouchBtn = document.getElementById('testTouchBtn');

        // Variáveis de estado
        let isLandscape = false;
        let currentDevice = 'desktop';

        // Função para atualizar o tamanho do frame
        function updateFrameSize() {
            const device = deviceSizes[currentDevice];
            let width = device.width;
            let height = device.height;
            
            if (isLandscape) {
                [width, height] = [height, width];
            }
            
            deviceFrame.style.width = `${width}px`;
            deviceFrame.style.height = `${height}px`;
            currentSize.textContent = `${width} x ${height}`;
        }

        // Event listeners
        deviceSelect.addEventListener('change', function() {
            currentDevice = this.value;
            updateFrameSize();
        });

        rotateBtn.addEventListener('click', function() {
            isLandscape = !isLandscape;
            updateFrameSize();
        });

        testScrollBtn.addEventListener('click', function() {
            testFrame.contentWindow.postMessage({ action: 'testScroll' }, '*');
        });

        testTouchBtn.addEventListener('click', function() {
            testFrame.contentWindow.postMessage({ action: 'testTouch' }, '*');
        });

        // Inicializar
        updateFrameSize();
    </script>
</body>
</html>
